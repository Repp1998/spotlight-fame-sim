<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="Spotlight — a fictional fame/life simulator." />
  <title>Spotlight — Fame Simulator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-root"></div>
  <script>
    window.addEventListener('error', () => {
      const app = document.getElementById('app');
      if (app && !app.children.length) {
        app.innerHTML = '<div style="max-width:760px;margin:80px auto;padding:24px;color:#fff;background:#16181c;border:1px solid #2f3336;border-radius:16px;font:16px/1.5 system-ui">Spotlight hit a startup error. Please refresh. If this remains visible, send the error shown in your browser console.</div>';
      }
    });
  </script>
  <script src="./01-core.js"></script>
  <script src="./02-state.js"></script>
  <script src="./03-ui.js"></script>
  <script src="./04-modal.js"></script>
  <script src="./05-agent.js"></script>
  <script src="./06-actions.js"></script>
</body>
</html>
